name: e_comerse_app
description: A new Flutter e-commerce project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  velocity_x: ^4.3.1
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/sans_regular.ttf
        - asset: assets/fonts/sans_semibold.ttf
          weight: 600
        - asset: assets/fonts/sans_bold.ttf
          weight: 700